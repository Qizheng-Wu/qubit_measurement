[project]
name = "labrad4_pkgs"
version = "0.1.0"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "ipython",
  "ipykernel",
  "twisted",
  "Cython",
  "pyserial",
  "future",
  "requests",
  "pandas",
  "tqdm",
  "scikit-learn",
  "numba",
  "pyvisa",
  "labcodes",
  "logqbit",
  "WaveMonitor",
  "pylabrad",
  "qcodes>=0.58.0",
]
requires-python = ">=3.11"
authors = [{ name = "Qiujv", email = "qiujv@outlook.com" }]
description = "Packages simplifying experiment scripts with LabRAD4."
readme = "readme.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  # "Operating System :: OS Independent",
]

[project.urls]
Homepage = "http://git.iqasz.com/qiujv/labrad4"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab4", "src/MMCSDriver"]
