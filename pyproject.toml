[project]
name = "qubit_measurement"
version = "0.1.0"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "ipython",
  "ipykernel",
  "twisted",
  "Cython",
  "pyserial",
  "future",
  "requests",
  "pandas",
  "tqdm",
  "scikit-learn",
  "numba",
  "pyvisa",
  "labcodes",
  "logqbit",
  "WaveMonitor",
  "pylabrad",
  "qcodes>=0.58.0",
  "scipy-stubs~=1.17.1",
  "pydantic>=2.13.4",
  "mmcs-driver",
]
requires-python = ">=3.11"
readme = "readme.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  # "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.uv.sources]
mmcs-driver = { path = "legacy/vendor/MMCSDriver", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: requires an explicitly enabled connection to laboratory hardware",
]
