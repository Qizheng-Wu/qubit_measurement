schema_version = 3

[instruments.readout_vna]
type = "vna"
address = "USB0::0x2A8D::0x5A01::MY47100891::0::INSTR"
transport_timeout_s = 10.0
read_termination = "\n"
write_termination = "\n"

[instruments.spectrum]
type = "spectrum_analyzer"
address = "TCPIP0::192.168.4.5::hislip0::INSTR"
transport_timeout_s = 30.0
read_termination = "\n"
write_termination = "\n"

[instruments.mmcs]
type = "mmcs"

[instruments.mmcs.boxes]
box1 = "192.168.4.8"

[instruments.mmcs.dac_boards.da_box1pcie2ch12]
sample_rate_hz = 500e6

[instruments.mmcs.signal_paths.qubit_xy_q1]
dac_board_id = "da_box1pcie2ch12"
q_over_i_gain = 1.0
i_offset = 0.0
q_offset = 0.0
q_phase_correction_rad = 0.0

[defaults.spectrum_sweep]
rbw_span_ratio = 0.01
input_attenuation_db = 20.0
acquisition_timeout_s = 30.0

[defaults.mmcs_execution]
cleanup_timeout_s = 5.0

[defaults.mmcs_awg]
minimum_waveform_samples = 800
period_ns = 1_000_000
start_trigger_ns = 40
safety_margin_s = 5.0

[defaults.vna_sweep]
points = 1001
bandwidth_hz = 1e3
averages = 1
acquisition_timeout_s = 30.0
